name: Publish to NPM

on:
  push:
    branches:
      - release

env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for creating Git tags
      id-token: write # Required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build library
        run: yarn build

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "samsung-device-helper@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "samsung-device-helper@$VERSION is already on npm, skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via npm trusted publishing (OIDC): the registry trusts this
      # repo + workflow directly, so no NPM_TOKEN secret is involved. Requires the
      # trusted publisher to be configured on the package's npmjs.com settings and
      # npm >= 11.5.1 (Node 24 bundles a new enough npm).
      - name: Publish to NPM
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Create Git tag
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
